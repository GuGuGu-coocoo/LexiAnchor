name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package_desktop:
        description: Explicitly build macOS/Windows application packages
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:web
      - run: pnpm audit --audit-level high

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  desktop-package:
    name: Desktop package (${{ matrix.os }})
    # Normal code synchronization must never create a new app package.
    if: github.event_name == 'workflow_dispatch' && inputs.package_desktop == true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop
