packages:
  - apps/*
  - packages/*

catalogMode: strict

# Electron Forge packaging currently requires a hoisted pnpm layout.
nodeLinker: hoisted

allowBuilds:
  core-js: false
  electron: true
  es5-ext: false
  esbuild: true

# Forge 7.x declares rebuild 3.x. Rebuild 4 keeps the named API Forge uses,
# removes the Git-based node-gyp dependency, and is verified by our package job.
overrides:
  '@electron/rebuild': 4.0.4
  '@electron/get>undici': 7.29.0
  brace-expansion: 5.0.9
  fast-uri: 3.1.6
  # Packager 18 uses only the default extract(zipPath, { dir }) API. Electron's
  # maintained replacement preserves it; Node 24 can require its ESM export.
  # Keep this override covered by both desktop package CI jobs.
  '@electron/packager>extract-zip': npm:@electron-internal/extract-zip@1.0.2
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'postcss@>=8.0.0 <8.5.23': 8.5.23
  'undici@>=6.0.0 <6.28.0': 6.28.0
  # EPUB.js allows only the vulnerable 0.7 line. The 0.8 line keeps the DOM
  # parser API and includes fixes for GHSA-wh4c, GHSA-2v35, GHSA-f6ww,
  # GHSA-x6wf, GHSA-j759, and GHSA-6gmq.
  '@xmldom/xmldom': 0.8.15
  tmp: 0.2.7

catalog:
  '@browsermt/bergamot-translator': 0.4.9
