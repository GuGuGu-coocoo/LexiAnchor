packages:
  - apps/*
  - packages/*

catalogMode: strict

# Electron Forge packaging currently requires a hoisted pnpm layout.
nodeLinker: hoisted

allowBuilds:
  core-js: false
  electron: true
  es5-ext: false
  esbuild: true

# Forge 7.x declares rebuild 3.x. Rebuild 4 keeps the named API Forge uses,
# removes the Git-based node-gyp dependency, and is verified by our package job.
overrides:
  '@electron/rebuild': 4.0.4
  # EPUB.js allows only the vulnerable 0.7 line. The 0.8 line keeps the DOM
  # parser API and includes fixes for GHSA-wh4c, GHSA-2v35, GHSA-f6ww,
  # GHSA-x6wf, and GHSA-j759.
  '@xmldom/xmldom': 0.8.13
  tmp: 0.2.7

catalog:
  '@browsermt/bergamot-translator': 0.4.9
